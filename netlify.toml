# Eventos presenciais: os slugs curtos que as LPs tinham no dominio antigo
# continuam resolvendo, agora dentro do namespace /eventos/. Cobre link digitado
# a mao e material que circulou com a forma curta.
[[redirects]]
  from = "/eventos/lideranca"
  to = "/eventos/lideranca-extraordinaria/"
  status = 301
[[redirects]]
  from = "/eventos/oratoria"
  to = "/eventos/oratoria-e-persuasao/"
  status = 301
[[redirects]]
  from = "/eventos/inteligencia-emocional"
  to = "/eventos/inteligencia-emocional-e-neurociencia/"
  status = 301

# Headers de seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # connect.facebook.net (script-src) e www.facebook.com (connect-src) sao do
    # Meta Pixel das LPs em /eventos/*: o snippet carrega fbevents.js do primeiro
    # e o fbevents moderno manda parte dos eventos por fetch/sendBeacon pro
    # segundo. NAO REMOVA sem desligar o tracking antes — o sintoma de remover e
    # "Refused to load" no console e evento sumindo do Events Manager, sem erro
    # visivel pro usuario.
    # Escopar isso so em /eventos/* nao funciona: multiplas politicas CSP sao
    # aplicadas em INTERSECAO, e a regra for="/*" tambem casa /eventos/*.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://esm.sh https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; frame-src https://www.youtube.com; connect-src 'self' https://*.supabase.co https://img.youtube.com https://www.facebook.com; media-src 'self'"

# Cache para assets estaticos (sem immutable para CSS/JS sem versionamento)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fontes auto-hospedadas (nomes versionados pelo proprio arquivo)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clientes-pareceiros-avantik/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
