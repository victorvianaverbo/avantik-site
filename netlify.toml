[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  publish = "."
  port = 8888
  framework = "#static"
  autoLaunch = false

# CDN de imagens (aceita qualquer URL externa)
[images]
  remote_images = ["https://.*"]

# ============================================================
# Bloqueio de arquivos internos (nao devem ser servidos na web).
# Retornam 404 real. NAO afeta paginas legitimas (academy/*/index.html,
# blog, etc.) — bloqueia so os fontes .md/.sql/.js de manutencao.
# ============================================================
[[redirects]]
  from = "/migrations/*"
  to = "/404.html"
  status = 404
  force = true
